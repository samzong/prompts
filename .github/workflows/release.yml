name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
      make_latest: ${{ steps.get_version.outputs.make_latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SemVer tag and manifest versions
        id: get_version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-v$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')}"
          python3 scripts/check-release-tag.py "$tag"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$tag^{commit}")"
          fi

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.1
          args: --current --output release-notes.md

      - name: Require release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -Eq '^\* .+' release-notes.md

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  check:
    needs: get-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build-artifacts:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [get-version, check]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS ARM64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS Intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x64

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ needs.get-version.outputs.version }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: ignore

  create-release:
    permissions:
      contents: write
    needs: [get-version, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts for debugging
        run: |
          echo "Artifacts directory structure:"
          find artifacts -type f -name "*" | head -20

      - name: Rename tar.gz files to include platform
        env:
          RELEASE_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          shopt -s nullglob
          for archive in artifacts/macOS*ARM64*/macos/Prompts.app.tar.gz{,.sig}; do
            suffix="${archive##*Prompts.app}"
            cp "$archive" "artifacts/Prompts_${RELEASE_VERSION}_aarch64.app$suffix"
          done
          for archive in artifacts/macOS*Intel*/macos/Prompts.app.tar.gz{,.sig}; do
            suffix="${archive##*Prompts.app}"
            cp "$archive" "artifacts/Prompts_${RELEASE_VERSION}_x64.app$suffix"
          done

      - name: Generate latest.json for updater
        run: |
          cat > latest.json << EOF
          {
            "version": "${{ needs.get-version.outputs.version }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/Prompts_${{ needs.get-version.outputs.version }}_aarch64.app.tar.gz",
                "signature": "$(cat artifacts/Prompts_${{ needs.get-version.outputs.version }}_aarch64.app.tar.gz.sig 2>/dev/null || echo '')"
              },
              "darwin-x86_64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/Prompts_${{ needs.get-version.outputs.version }}_x64.app.tar.gz",
                "signature": "$(cat artifacts/Prompts_${{ needs.get-version.outputs.version }}_x64.app.tar.gz.sig 2>/dev/null || echo '')"
              },
              "windows-x86_64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/Prompts_${{ needs.get-version.outputs.version }}_x64_en-US.msi",
                "signature": "$(cat artifacts/Windows*/msi/Prompts_${{ needs.get-version.outputs.version }}_x64_en-US.msi.sig 2>/dev/null || echo '')"
              }
            },
            "notes": "Release ${{ needs.get-version.outputs.version }}"
          }
          EOF
          
          echo "Generated latest.json:"
          cat latest.json

      - name: Create Release and Upload artifacts
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ needs.get-version.outputs.version }}
          body_path: artifacts/release-notes/release-notes.md
          draft: false
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.get-version.outputs.make_latest }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/Prompts_${{ needs.get-version.outputs.version }}_aarch64.app.tar.gz
            artifacts/Prompts_${{ needs.get-version.outputs.version }}_aarch64.app.tar.gz.sig
            artifacts/Prompts_${{ needs.get-version.outputs.version }}_x64.app.tar.gz
            artifacts/Prompts_${{ needs.get-version.outputs.version }}_x64.app.tar.gz.sig
            latest.json
